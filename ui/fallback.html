<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OnTheSpot Restarting</title>
  <style>
    :root {
      color-scheme: light;
    }
    body {
      margin: 0;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      background: #f7f3ed;
      color: #2a2a2a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      width: min(720px, 92vw);
      border: 1px solid #e2d9ce;
      border-radius: 16px;
      padding: 28px 32px;
      background: #fffaf3;
      box-shadow: 0 12px 30px rgba(60, 42, 20, 0.12);
    }
    h1 {
      margin: 0 0 10px;
      font-size: 28px;
      letter-spacing: 0.2px;
    }
    p {
      margin: 8px 0;
      line-height: 1.5;
      font-size: 16px;
    }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
      margin-top: 16px;
    }
    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #d9782b;
      animation: pulse 1.6s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.7; }
      50% { transform: scale(1.35); opacity: 1; }
    }
    .hint {
      color: #6a5a45;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>OnTheSpot is restarting</h1>
    <p>The backend is temporarily unavailable. This page will reconnect automatically.</p>
    <div class="status">
      <span class="dot" aria-hidden="true"></span>
      <span>Waiting for backend…</span>
    </div>
    <p class="hint">If this persists, check container logs for errors.</p>
  </div>
  <script>
    const retryMs = 2000;
    function tryReload() {
      fetch('/__health', { cache: 'no-store' })
        .then((resp) => {
          if (resp.ok) {
            window.location.reload();
          }
        })
        .catch(() => {
          setTimeout(tryReload, retryMs);
        });
    }
    setTimeout(tryReload, retryMs);
  </script>
</body>
</html>
